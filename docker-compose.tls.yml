# Overlay: TLS termination on nginx (self-signed lab certs).
# Prerequisites: deploy/certs/server.crt + server.key (see scripts/gen-tls.*)
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up --build
#
# HTTPS UI: https://localhost:8443
# API is not published on :8000 (only via nginx). Syslog UDP stays on 5140.

services:
  api:
    environment:
      CORS_ORIGINS: https://localhost:8443,https://127.0.0.1:8443,http://localhost:8080
    ports:
      - "5140:5140/udp"

  web:
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./web/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
