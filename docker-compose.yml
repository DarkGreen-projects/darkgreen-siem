services:
  postgres:
    image: postgres:16-alpine
    logging: &default_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1g
    cpus: 1.0
    environment:
      POSTGRES_USER: siem
      POSTGRES_PASSWORD: siem
      POSTGRES_DB: darkgreen_siem
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siem -d darkgreen_siem"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    logging: *default_logging
    mem_limit: 1g
    cpus: 1.0
    environment:
      DATABASE_URL: postgresql+psycopg://siem:siem@postgres:5432/darkgreen_siem
      RULES_DIR: /app/rules
      SAMPLES_DIR: /app/samples
      # WARNING: 0.0.0.0 + published 5140/udp is lab-only. Default secret required for UDP ingest.
      SYSLOG_HOST: ${SYSLOG_HOST:-0.0.0.0}
      SYSLOG_PORT: "5140"
      SYSLOG_SHARED_SECRET: ${SYSLOG_SHARED_SECRET:-dg-lab-syslog}
      SEED_ON_START: "true"
      LOG_DIR: /app/logs
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      AUTH_ENABLED: "true"
      STRICT_SECRETS: ${STRICT_SECRETS:-false}
      DISABLE_OPENAPI: ${DISABLE_OPENAPI:-false}
      ALLOW_INSECURE_WEBHOOKS: ${ALLOW_INSECURE_WEBHOOKS:-false}
      EGRESS_HOST_ALLOWLIST: ${EGRESS_HOST_ALLOWLIST:-}
      DEMO_USERNAME: analyst
      DEMO_PASSWORD: ${DEMO_PASSWORD:-darkgreen}
      AUTH_SECRET: ${AUTH_SECRET:-darkgreen-siem-compose-secret}
      SIEM_API_TOKEN: ${SIEM_API_TOKEN:-dg-lab-token-compose}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      HEALTH_STALE_MINUTES: ${HEALTH_STALE_MINUTES:-5}
      HEALTH_SILENT_MINUTES: ${HEALTH_SILENT_MINUTES:-30}
      SILENCE_ALERTS_ENABLED: "true"
      PURGE_INTERVAL_SEC: ${PURGE_INTERVAL_SEC:-300}
      RULE_INTERVAL_SEC: ${RULE_INTERVAL_SEC:-30}
      VT_API_KEY: ${VT_API_KEY:-}
      VT_CACHE_TTL_HOURS: "24"
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
      DEFAULT_TENANT_ID: lab
      DEFAULT_TENANT_NAME: Lab
      RUN_BACKGROUND_JOBS: "true"
    ports:
      - "8000:8000"
      # UDP ingest requires SYSLOG_SHARED_SECRET (compose default: dg-lab-syslog)
      - "5140:5140/udp"
    volumes:
      - ./rules:/app/rules:rw
      - ./samples:/app/samples:ro
      - api_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    logging: *default_logging
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "8080:80"
    depends_on:
      - api

  # Traffico demo continuo: docker compose --profile demo up --build
  log-generator:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: services/log-generator/Dockerfile
    logging: *default_logging
    mem_limit: 256m
    cpus: 0.5
    environment:
      API_URL: http://api:8000
      SYSLOG_HOST: api
      SYSLOG_PORT: "5140"
      SYSLOG_SHARED_SECRET: ${SYSLOG_SHARED_SECRET:-dg-lab-syslog}
      INTERVAL_SEC: ${INTERVAL_SEC:-8}
      SIEM_API_TOKEN: ${SIEM_API_TOKEN:-dg-lab-token-compose}
    depends_on:
      - api

volumes:
  pgdata:
  api_logs:
