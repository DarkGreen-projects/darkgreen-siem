# NXLog sample: Windows Security → DarkGreen SIEM (UDP 5140 JSON)

define ROOT C:\Program Files\nxlog
define CERTDIR %ROOT%\cert
define CONFDIR %ROOT%\conf
define LOGDIR %ROOT%\data
define LOGFILE %LOGDIR%\nxlog.log

Mod u_syslog {
    Module      xm_syslog
}

Mod u_json {
    Module      xm_json
}

<Input eventlog>
    Module      im_mseventlog
    Channel     Security
    # Optional: Exec if ($EventID NOT IN (4624, 4625, 4688, 1102, 4771)) drop();
</Input>

<Output siem_udp>
    Module      om_udp
    Host        127.0.0.1
    Port        5140
    Exec        $raw_event = to_json();
</Output>

<Route windows_to_siem>
    Path        eventlog => siem_udp
</Route>
