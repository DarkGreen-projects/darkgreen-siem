# rsyslog sample: forward all local logs to DarkGreen SIEM UDP 5140
# Copy snippets into /etc/rsyslog.d/99-darkgreen.conf then: systemctl restart rsyslog

*.* @127.0.0.1:5140

# Prefer TCP if you terminate elsewhere (not used by DarkGreen lab UDP listener):
# *.* @@siem.lab.local:5140

# Example: only auth-related facilities
# auth,authpriv.* @127.0.0.1:5140
