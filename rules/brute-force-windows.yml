id: brute-force-windows
name: Windows brute-force login
title: Multiple failed Windows logons
description: More than 5 failed logons for the same user within 10 minutes.
threat_brief: >
  Repeated failed logons often indicate password spraying or credential stuffing
  against a domain account. Check source IP reputation, account lockout status,
  and whether a later login_success followed from the same host.
type: threshold
severity: high
enabled: true
window_minutes: 10
threshold: 5
group_by: user
cooldown_minutes: 15
match:
  action: login_failed
  source_type: windows
