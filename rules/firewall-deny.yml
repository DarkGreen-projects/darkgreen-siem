id: firewall-deny-burst
name: Firewall deny from external IP
title: External firewall deny observed
description: Match deny actions on firewall events (demo match rule).
threat_brief: >
  A firewall deny from an external address can be reconnaissance, an exploit
  attempt, or misconfigured outbound traffic. Review destination port/service,
  volume of similar denies, and whether the same src_ip appears in auth failures.
type: match
severity: medium
enabled: true
window_minutes: 30
cooldown_minutes: 20
match:
  source_type: firewall
  action: deny
