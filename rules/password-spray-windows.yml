id: password-spray-windows
name: Password spray Windows
title: Burst login_failed da stesso src_ip (spray)
description: >
  Conta login_failed Windows raggruppati per src_ip. Un IP con molti fallimenti
  su utenti diversi tipicamente indica password spray.
threat_brief: >
  Password spray: stesso origine prova poche password su molti account per evitare
  lockout. Verifica utenti colpiti, geo/IP reputation, e se compaiono logon riusciti
  subito dopo. Controlla anche EventID 4625 e LogonType.
type: threshold
severity: high
enabled: true
window_minutes: 15
cooldown_minutes: 30
threshold: 5
group_by: src_ip
match:
  source_type: windows
  action: login_failed
